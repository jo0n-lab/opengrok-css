services:
  opengrok:
    image: opengrok/docker:latest
    platform: linux/amd64
    container_name: portfolio-opengrok
    environment:
      SYNC_PERIOD_MINUTES: "0"
      AVOID_PROJECTS: "0"
      REST_TOKEN: "dev-local-token"
    volumes:
      - ./.opengrok/src:/opengrok/src
      - opengrok-etc:/opengrok/etc
      - opengrok-data:/opengrok/data
    ports:
      - "8080:8080"
      - "5001:5000"

  css-proxy:
    image: nginx:1.27-alpine
    container_name: portfolio-opengrok-css-proxy
    depends_on:
      - opengrok
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist/default:/usr/share/nginx/opengrok-css/default:ro
    ports:
      - "8081:8081"

volumes:
  opengrok-etc:
  opengrok-data:
