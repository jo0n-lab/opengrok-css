server {
    listen 8081;
    server_name _;

    location = /default/style-1.0.4.min.css {
        alias /usr/share/nginx/opengrok-css/default/style-1.0.4.css;
        default_type text/css;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /default/style-1.0.4.css {
        alias /usr/share/nginx/opengrok-css/default/style-1.0.4.css;
        default_type text/css;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /default/theme-toggle.js {
        alias /usr/share/nginx/opengrok-css/default/theme-toggle.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = / {
        return 302 /xref/;
    }

    location / {
        proxy_pass http://opengrok:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<head>' '<head><script>(function(){try{document.documentElement.setAttribute("data-og-theme",localStorage.getItem("opengrok-theme")||"dark")}catch(e){document.documentElement.setAttribute("data-og-theme","dark")}})();</script>';
        sub_filter '</body>' '<script src="/default/theme-toggle.js"></script></body>';

        proxy_hide_header ETag;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
